# No agent or tool is named in this repository's history.
#
# The rule is the house rule below, followed on the trunk and ignored on one
# branch: 247 commits carrying a "Co-Authored-By: <agent>" trailer reached
# GitHub, and the merged pull requests earned the account a Pair Extraordinaire
# badge. refs/pull/*/head is immutable server side, so those cannot be rewritten
# away. This lane is the check that keeps the next 247 from being pushed.
#
# It looks at the commits a push or a PR actually adds, not the whole history,
# so the old refs that cannot be fixed do not fail every future run.
name: attribution

# Called by ci.yml rather than triggered on its own, so one push is one run
# instead of four. workflow_dispatch stays: this lane is worth being able to
# fire by hand without the other three. The branch rules that used to live in
# the `on:` block below are in ci.yml now, beside the other three, where they
# can be read together.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  no-agent-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The range every commit scan below reads, worked out ONCE and published
      # where the other steps can see it.
      #
      # It used to be computed inside the first scanning step, which is where it
      # was needed first. A `run:` block is its own shell, so the third step
      # read a variable that had never been set in it. Under `set -u` that kills
      # the command substitution before it runs; the `2>/dev/null` swallowed the
      # message and the `|| :` swallowed the status, so the step printed "clean"
      # having read nothing, and had done so since the day it was written.
      # $GITHUB_ENV is the only thing that carries a value from one step to the
      # next, and a variable is now either in it or a step's own.
      - name: the commit range every scan below reads
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            case "$BEFORE" in
              ""|0000000000000000000000000000000000000000) RANGE="${{ github.sha }} -50" ;;
              *) git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
                   && RANGE="$BEFORE..${{ github.sha }}" \
                   || RANGE="${{ github.sha }} -50" ;;
            esac
          fi
          echo "scanning: $RANGE"
          echo "RANGE=$RANGE" >> "$GITHUB_ENV"

      # A check that has never been observed to fail is not known to work. The
      # prose scan reported "clean" for its entire life while reading nothing,
      # and no run ever said otherwise, because a scan that FINDS nothing and a
      # scan that LOOKS AT nothing print the same word. So each pattern is now
      # made to catch a violation planted for it, in a throwaway repository, on
      # every run. A pattern that stops firing fails the lane instead of going
      # quiet. This is deliberately inline rather than a checker in tools/: this
      # file is already excluded from the greps below, and a new tracked file
      # full of tool names would need an exclusion of its own, which is exactly
      # the kind of carve-out that let the last hole stay open.
      - name: the scanners still catch a planted violation
        run: |
          set -eu
          : "${RANGE:?unset -- every scan below would read nothing and pass}"
          T="$(mktemp -d)"
          git init -q "$T"
          cd "$T"
          git -c user.email=ci@local -c user.name=ci commit -q --allow-empty \
            -m "Plant a trailer" -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          git -c user.email=ci@local -c user.name=ci commit -q --allow-empty \
            -m "Plant prose" -m "This sentence names Claude to be caught."
          M="$(git log --format='%H%n%B%n--%n')"
          printf '%s' "$M" | grep -qiE 'co-authored-by:.*(anthropic|claude|openai|copilot|cursor|codex|chatgpt|gpt-|gemini|devin|aider)' \
            || { echo "::error::the trailer pattern no longer fires"; exit 1; }
          printf '%s' "$M" | grep -qiE -e '(superpowers|copilot|cursor|chatgpt|aider|devin)' \
                                       -e '\bclaude\b|\banthropic\b' \
            || { echo "::error::the prose pattern no longer fires"; exit 1; }
          mkdir -p docs/claude && : > docs/claude/planted.md && git add -A
          git ls-files | grep -qiE "(^|/)(superpowers|claude|anthropic|copilot|cursor|codex|chatgpt|aider|devin)" \
            || { echo "::error::the path pattern no longer fires"; exit 1; }
          echo "selftest: trailer, prose and path patterns all fire"

      - name: commit messages name no agent
        run: |
          set -u
          : "${RANGE:?unset -- this scan would read nothing and report clean}"
          echo "scanning $(git log $RANGE --format=%H | wc -l) commit(s): $RANGE"

          BAD=$(git log $RANGE --format='%H%n%B%n--%n' \
                | grep -iE -e 'co-authored-by:.*(anthropic|claude|openai|copilot|cursor|codex|chatgpt|gpt-|gemini|devin|aider)' \
                           -e 'generated with \[?claude code' \
                || :)
          if [ -n "$BAD" ]; then
            echo "::error::agent attribution in a commit message. No agent or tool is named anywhere in this repository."
            echo "$BAD"
            exit 1
          fi
          echo "clean"

      - name: tracked files name no agent as author
        run: |
          set -u
          if git grep -nIiE 'co-authored-by:.*(anthropic|claude|openai|copilot)|generated with \[?claude code' \
               -- . ':(exclude).github/workflows/attribution.yml' ':(exclude)tools/hooks/*' ':(exclude)tools/install_hooks.sh'; then
            echo "::error::agent attribution in a tracked file."
            exit 1
          fi
          echo "clean"

      # The trailer half again, in prose. Two commits describing the REMOVAL of
      # a directory named after a tool named it five times between them, and
      # every check in this lane passed: they all looked for trailers. The rule
      # is that the actor is never the subject, and a path is a subject. The
      # commit-msg hook refuses these before they are written; this is the
      # backstop for a clone that never ran tools/install_hooks.sh.
      - name: commit messages name no tool in prose
        run: |
          set -u
          : "${RANGE:?unset -- this scan would read nothing and report clean}"
          echo "scanning $(git log $RANGE --format=%H | wc -l) commit(s): $RANGE"

          BAD=$(git log $RANGE --format='%H%n%B%n--%n' \
                | grep -inE -e '(superpowers|copilot|cursor|chatgpt|aider|devin)' \
                            -e '\bclaude\b|\banthropic\b' -e '\.claude/' \
                            -e '\bagentic\b|\bsub-?agent\b' \
                | grep -viE 'claude\.md' || :)
          if [ -n "$BAD" ]; then
            echo "::error::a commit message names a tool in prose. The actor is never the subject."
            echo "$BAD"
            exit 1
          fi
          echo "clean"

      # The trailer was only ever the obvious half. The rule is
      # that the ACTOR IS NEVER THE SUBJECT, and prose survived the first two
      # sweeps -- so did a PATH: docs/superpowers/ held ten tracked plan files
      # under a tool's name, four of them opening "For agentic workers:
      # REQUIRED SUB-SKILL: use superpowers:...", published by Pages, and five
      # firmware sources carried "// See docs/superpowers/specs/..." in a
      # comment. Every check above was green the whole time, because none of
      # them looks at a filename or at a sentence.
      - name: no tool named in a path or in prose
        run: |
          set -u
          TOOLS='superpowers|claude|anthropic|copilot|cursor|codex|chatgpt|aider|devin'
          # There is no exception any more. The keyboard rules were the one
          # tracked path the rule had to carve out for; they are untracked now,
          # so re-adding that path is a failure like any other.
          if git ls-files | grep -iE "(^|/)($TOOLS)"; then
            echo "::error::a tracked PATH names a tool. No agent or tool is named anywhere in this repository."
            exit 1
          fi
          # Prose. The hooks strip the trailer and have to quote what they
          # strip, so those are excluded by path.
          if git grep -nIiE "superpowers:|\.claude/|(claude|copilot|cursor|codex|chatgpt) (code|cli)|\bagentic\b|\bsub-?agent\b" \
               -- . ':(exclude).github/workflows/attribution.yml' ':(exclude)tools/hooks/*' ':(exclude)tools/install_hooks.sh' ':(exclude).gitignore'; then
            echo "::error::a tracked file names a tool in prose."
            exit 1
          fi
          echo "clean"

      # Not attribution, the same leak. The plan file that named a tool also
      # carried /Users/<owner>/... in a folder GitHub Pages serves, so the
      # owner's account name was published with it.
      - name: no absolute home path
        run: |
          set -u
          if git grep -nIE '/Users/[a-z0-9_-]+/|/home/[a-z0-9_-]+/' \
               -- . ':(exclude).github/workflows/attribution.yml'; then
            echo "::error::an absolute home path in a tracked file."
            exit 1
          fi
          echo "clean"
