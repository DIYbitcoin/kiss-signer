# Reproducible release build: every push to main rebuilds the release
# firmware in the same Docker ESP-IDF toolchain a verifier would use,
# re-runs the release safety checks (dev seed absent, version + commit
# present - tools/build_release.sh fails the job if any check fails),
# and publishes the firmware hashes + artifact. Because the release
# profile builds with CONFIG_APP_REPRODUCIBLE_BUILD (no compile date
# embedded), the same commit must always produce the same bytes - so
# anyone can rebuild locally and compare hashes against this job.
name: reproducible release build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build verified release (Docker ESP-IDF v6.0.1)
        run: tools/build_release.sh

      - name: Firmware hashes
        run: |
          sha256sum \
            build-release/guition_kiss_bringup.bin \
            build-release/bootloader/bootloader.bin \
            build-release/partition_table/partition-table.bin \
            | tee SHA256SUMS-ci.txt
          {
            echo "### Release firmware SHA256 (commit ${GITHUB_SHA::7})"
            echo '```'
            cat SHA256SUMS-ci.txt
            echo '```'
            echo "Rebuild locally with \`tools/build_release.sh\` and compare."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiss-wallet-release-${{ github.sha }}
          path: |
            build-release/guition_kiss_bringup.bin
            build-release/bootloader/bootloader.bin
            build-release/partition_table/partition-table.bin
            SHA256SUMS-ci.txt
