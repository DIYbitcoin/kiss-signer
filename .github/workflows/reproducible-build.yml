# Reproducible release builds: every push to main rebuilds BOTH release lanes
# (normal release + the encrypted final-board release, which is what funded
# firmware actually runs) in the same Docker ESP-IDF toolchain a verifier would
# use, re-runs each lane's safety checks (dev seed absent, version + commit
# present, encryption config, C6 radio-hold code present, zero radio/network
# objects in the linker map - the build scripts fail the job if any check
# fails), and publishes the firmware hashes + artifacts.
#
# UNSIGNED, on purpose, and this job had never once succeeded without it.
#
# Both build scripts hard-exit when ~/.kiss-signer/kiss_ota.pem is absent, and
# no runner has that key or should. So every run of this workflow failed at the
# signing step while the header above claimed anyone could rebuild and compare.
#
# Handing CI the key would not have fixed it either. espsecure sign-data is
# ECDSA: signing identical input twice produces different valid bytes, and the
# block is appended to the very file whose hash is published here. Comparing
# hashes of signed images is not a weaker check, it is a meaningless one.
#
# So the two questions are answered separately, which is the only way either
# can be answered honestly:
#
#   "did this commit produce these bytes"  -> here, unsigned, by anyone
#   "is this the firmware KISS published"  -> the signature, made on a machine
#                                             that holds the key, and the signed
#                                             hashes in SHA256SUMS beside the
#                                             release
#
# The unsigned app is NOT installable: a device checks the signature before it
# writes an SD update, so it refuses these images. build-*/UNSIGNED is written
# beside them to say so, and it is uploaded with the artifact deliberately.
#
# TWO ARCHITECTURES, because one proved nothing to the people most likely to
# check. The published hash is not reproducible across hosts even though the
# build is: ESP-IDF stamps a hash of the ELF -- debug sections included -- into
# the image, and that depends on the machine that compiled it. So an arm64 Mac
# gets a different sha256 from an amd64 runner for the same commit, and until
# now the only evidence that this was harmless was one measurement taken by
# hand in August and never repeated. A verifier on Apple silicon saw a
# mismatch, had nothing to compare against, and had no way to tell that window
# from a real difference. The arm64 lane below rebuilds the same commit and
# compares byte for byte, failing on any difference outside that window.
#
# Both lanes name the toolchain by digest, from tools/idf_image.sh, not by the
# espressif/idf:v6.1 tag. A tag can be repushed, and a rebuild that silently
# used a different compiler than the one that made the published hashes is the
# exact failure this job exists to rule out.
name: reproducible release build

# Called by ci.yml rather than triggered on its own, so one push is one run
# instead of four. workflow_dispatch stays: this lane is worth being able to
# fire by hand without the other three. The branch rules that used to live in
# the `on:` block below are in ci.yml now, beside the other three, where they
# can be read together.
on:
  workflow_call:
  workflow_dispatch:

env:
  # Read by tools/build_release.sh and tools/build_encrypted_release.sh.
  KISS_UNSIGNED: "1"

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the docs freshness check below counts commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This workflow runs on a push to main, which is the release line, and a
      # release is exactly when the pictures stop being an internal detail:
      # docs/walkthrough.md and the readme set are what somebody reads before
      # they trust the device. desktop-tests only counts the gap; here a gap
      # is a failure. Regenerate with tools/gen_docs_shots.sh before the merge.
      - name: docs freshness (release line)
        run: |
          python3 tools/check_docs_fresh.py --selftest
          python3 tools/check_docs_fresh.py --strict

      - name: Build verified release, unsigned (Docker ESP-IDF v6.1)
        run: tools/build_release.sh

      - name: Refuse to publish a hash of a signed image
        run: |
          # The whole point of the job. If a key ever reaches this runner the
          # signing step would silently make the hashes below unreproducible,
          # and nothing else would notice.
          test -f build-release/UNSIGNED || {
            echo "FAIL: build-release/UNSIGNED is missing, so this app was signed."
            echo "      Its hash is not reproducible and must not be published here."
            exit 1
          }

      - name: Firmware hashes (unsigned)
        run: |
          sha256sum \
            build-release/guition_kiss_bringup.bin \
            build-release/bootloader/bootloader.bin \
            build-release/partition_table/partition-table.bin \
            | tee SHA256SUMS-ci.txt
          {
            echo "### Release firmware SHA256, UNSIGNED (commit ${GITHUB_SHA::7})"
            echo '```'
            cat SHA256SUMS-ci.txt
            echo '```'
            echo "Rebuild and compare:"
            echo '```'
            echo "KISS_UNSIGNED=1 tools/build_release.sh"
            echo '```'
            echo "These are the bytes the commit produces. The signed image"
            echo "published as a release differs by an appended ECDSA block,"
            echo "which is not byte-reproducible; check that one against"
            echo "SHA256SUMS in the release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiss-signer-release-unsigned-${{ github.sha }}
          path: |
            build-release/guition_kiss_bringup.bin
            build-release/bootloader/bootloader.bin
            build-release/partition_table/partition-table.bin
            build-release/UNSIGNED
            SHA256SUMS-ci.txt
            LICENSE
            THIRD_PARTY_NOTICES.md

  # The Mac-shaped half of the answer. Same commit, same pinned toolchain
  # digest (the index digest resolves per arch), different CPU.
  arm64-cross-check:
    needs: release-build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A comparison that always passes is worse than no comparison, and this
      # one is a hand-written byte window over a struct layout. Prove it still
      # rejects a changed instruction before trusting it about a real build.
      - name: Prove the comparison still fails on a real difference
        run: python3 tools/check_repro_match.py --selftest

      - name: Build verified release, unsigned (Docker ESP-IDF v6.1, arm64)
        run: tools/build_release.sh

      - name: Refuse to compare a signed image
        run: |
          test -f build-release/UNSIGNED || {
            echo "FAIL: build-release/UNSIGNED is missing, so this app was signed."
            echo "      A signature is ECDSA and differs every time, so this"
            echo "      comparison would fail for a reason that means nothing."
            exit 1
          }

      - name: Fetch the amd64 image built from this commit
        uses: actions/download-artifact@v4
        with:
          name: kiss-signer-release-unsigned-${{ github.sha }}
          path: amd64

      # The bootloader and the partition table carry no ELF hash, so those two
      # are a plain cmp and any difference at all is a failure.
      - name: Compare arm64 against amd64
        run: |
          python3 tools/check_repro_match.py \
            amd64/build-release/guition_kiss_bringup.bin \
            build-release/guition_kiss_bringup.bin
          cmp amd64/build-release/bootloader/bootloader.bin \
              build-release/bootloader/bootloader.bin
          cmp amd64/build-release/partition_table/partition-table.bin \
              build-release/partition_table/partition-table.bin
          echo "bootloader and partition table are byte-identical across arch"

      - name: Firmware hashes (unsigned, arm64)
        run: |
          sha256sum \
            build-release/guition_kiss_bringup.bin \
            build-release/bootloader/bootloader.bin \
            build-release/partition_table/partition-table.bin \
            | tee SHA256SUMS-arm64-ci.txt
          {
            echo "### Release firmware SHA256, UNSIGNED, arm64 (commit ${GITHUB_SHA::7})"
            echo '```'
            cat SHA256SUMS-arm64-ci.txt
            echo '```'
            echo "The app hash differs from the amd64 lane ON PURPOSE, in the"
            echo "32 bytes of app_elf_sha256 and the two checksums that cover"
            echo "it. Every instruction and data byte matched, and the"
            echo "bootloader and partition table matched exactly. If you build"
            echo "on an Apple silicon Mac, these are the hashes to compare"
            echo "against."
          } >> "$GITHUB_STEP_SUMMARY"

  encrypted-release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build encrypted release, unsigned (Docker ESP-IDF v6.1)
        run: tools/build_encrypted_release.sh

      - name: Refuse to publish a hash of a signed image
        run: |
          test -f build-encrypted-release/UNSIGNED || {
            echo "FAIL: build-encrypted-release/UNSIGNED is missing, so this app"
            echo "      was signed. Its hash is not reproducible and must not be"
            echo "      published here."
            exit 1
          }

      - name: Firmware hashes (unsigned)
        run: |
          sha256sum \
            build-encrypted-release/guition_kiss_bringup.bin \
            build-encrypted-release/bootloader/bootloader.bin \
            build-encrypted-release/partition_table/partition-table.bin \
            | tee SHA256SUMS-encrypted-ci.txt
          {
            echo "### Encrypted-release firmware SHA256, UNSIGNED (commit ${GITHUB_SHA::7})"
            echo '```'
            cat SHA256SUMS-encrypted-ci.txt
            echo '```'
            echo "Rebuild and compare:"
            echo '```'
            echo "KISS_UNSIGNED=1 tools/build_encrypted_release.sh"
            echo '```'
            echo "NEVER flash this image to a board this recipe burns fuses on:"
            echo "it carries no signature, so that board could never be updated."
          } >> "$GITHUB_STEP_SUMMARY"

      # The lane that ships every release after the burn, and nothing built it
      # here. The burn happens once per board; this is the one an owner
      # installs from a card for the rest of the board's life, so a break in it
      # would first be noticed while trying to ship a fix. It costs a second
      # full compile, on a workflow that already runs only on pushes to main.
      - name: Build the update lane, unsigned
        run: KISS_ENC_UPDATE=1 tools/build_encrypted_release.sh

      - name: The update lane builds the same firmware, and no bootloader
        run: |
          # Same commit, same config: an update IS the burn's app, signed with
          # one key instead of three. Different bytes would mean the lane
          # changed the firmware rather than only the signing, and the hashes
          # published above would describe an image no board ever runs.
          cmp build-encrypted-release/guition_kiss_bringup.bin \
              build-encrypted-update/guition_kiss_bringup.bin || {
            echo "FAIL: the update lane produced different firmware bytes than"
            echo "      the burn lane built from the same commit."
            exit 1
          }
          # A bootloader in that directory is the one way this lane could hurt
          # a board: signed with the single key it holds, it would burn one
          # digest, revoke the other two slots on first boot, and leave a board
          # that can never rotate a leaked key again.
          test ! -f build-encrypted-update/bootloader/bootloader.bin || {
            echo "FAIL: the update lane left a bootloader in its build."
            exit 1
          }
          echo "PASS: identical firmware, and no bootloader to burn with"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiss-signer-encrypted-release-unsigned-${{ github.sha }}
          path: |
            build-encrypted-release/guition_kiss_bringup.bin
            build-encrypted-release/bootloader/bootloader.bin
            build-encrypted-release/partition_table/partition-table.bin
            build-encrypted-release/UNSIGNED
            SHA256SUMS-encrypted-ci.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
