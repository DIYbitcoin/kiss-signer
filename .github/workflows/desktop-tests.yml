# Desktop test lane: everything that proves correctness WITHOUT hardware or
# the ESP-IDF toolchain, so it runs in ~2 minutes on every push and PR (the
# heavyweight reproducible-build workflow covers the firmware itself).
#
# Each step is a failure mode this project has actually hit:
#   * generator drift  - generated i18n tables/glyph lists out of sync with the
#                        JSONs (a missing glyph hard-hangs LVGL on device)
#   * crypto suite     - BIP39 vector + PSBT parsing against vendored libwally
#   * sim smoke walks  - full scripted UI walk in Latin/CJK/Cyrillic locales;
#                        a rendering hang (missing glyph, heap exhaustion,
#                        layer-alloc loop) shows up as the timeout firing
#   * BlueWallet interop - PSBT round-trip through BlueWallet's real npm QR
#                        stack vs our qr_transport
name: desktop tests

#
# Runs on both branches, because passing this lane is exactly the bar for
# landing on develop: develop is the trunk and must always be green here,
# but green here proves nothing about hardware. main is the release line -
# it only moves on a tagged release that has been run on a real device, and
# that is what reproducible-build.yml publishes hashes for.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: i18n generator drift
        run: |
          python3 tools/gen_i18n.py
          git diff --exit-code -- main/i18n_keys.h main/i18n_tables.c 'tools/fonts/glyphs_*.txt'

      - name: crypto tests (BIP39 vector + PSBT suite)
        run: |
          bash sim/build_test.sh
          /tmp/kisstest | tee /tmp/kisstest.log
          grep -q "PASS: BIP39 test vector -> 73C5DA0A" /tmp/kisstest.log

      # The harness had silently stopped building (a source file was added to
      # the device component and never to the fuzz link line), so nobody
      # noticed it was gone. It only stays honest if CI runs it.
      - name: parser fuzz (ASAN + UBSAN)
        run: |
          bash sim/build_fuzz.sh
          /tmp/kissfuzz | tee /tmp/kissfuzz.log
          grep -q "ALL FUZZ PASS" /tmp/kissfuzz.log

      # managed_components/ is gitignored (the IDF component manager populates
      # it during device builds), so fetch LVGL ourselves at the exact version
      # dependencies.lock pins for the device.
      - name: fetch LVGL for the sim
        run: |
          LV=$(awk '/^  lvgl\/lvgl:/{f=1} f&&/version:/{print $2; exit}' dependencies.lock)
          echo "dependencies.lock pins lvgl/lvgl $LV"
          git clone -q -c advice.detachedHead=false --depth 1 --branch "v$LV" \
            https://github.com/lvgl/lvgl.git managed_components/lvgl__lvgl

      - name: sim smoke walks (en / ja / ru)
        run: |
          bash sim/build_sim.sh
          for L in en ja ru; do
            echo "== SIM_LANG=$L =="
            timeout 300 env SIM_LANG=$L /tmp/fruitsim > /tmp/sim_$L.log
            tail -1 /tmp/sim_$L.log
          done

      # The walk drives the UI with hardcoded touch coordinates. When a layout
      # moves, a tap lands on background: the frame still saves, it is just a
      # copy of the one before, and the walk still "passes". That is how the
      # 2min->5min auto-lock change left the wipe and amnesic-mode steps dead
      # for four commits. Identical consecutive frames mean a dead interaction.
      - name: simulator taps still hit something
        run: python3 tools/check_sim_taps.py

      # The walkthrough's screenshots are simulator frames, so a renamed or
      # deleted save() in sim_main.c silently orphans a picture in the docs.
      # This checks the manifest still resolves; it deliberately does not
      # compare pixels, because zlib versions differ and a flaky docs job
      # teaches people to ignore the docs job.
      - name: docs screenshots manifest
        run: python3 tools/gen_docs_shots.py --check

      # Same discipline as the screenshot manifest above, applied to the thing
      # that writes firmware to people's devices. docs/installer/ is generated
      # by tools/make_web_release.sh and nothing regenerates it automatically,
      # so it goes stale the moment VERSION moves. Between beta6 and beta7 the
      # site served beta6 while every document described beta7. Fails only when
      # the page still offers the button, since a pulled button flashes nothing.
      - name: installer artifacts match VERSION
        run: python3 tools/check_installer_version.py

      # The camera overlay glyph-coverage check used to live here. It read the
      # desktop TTFs the strips were baked from and named any character they
      # lacked, which is how every Russian overlay, plus Vietnamese, Croatian
      # and Czech diacritics, had shipped as tofu boxes. There is nothing left
      # for it to read: the overlay now composes from the same font_kiss faces
      # every other screen uses, so its coverage is the coverage the font
      # generator and sim/fitcheck.c already gate. The overlay text gate below
      # replaces it, and does more.

      # Type-size ratchet. Fails when a button the user must READ to act
      # correctly (sign, wipe, replace, verify) renders at font14 in ANY of the
      # 21 locales, which is how a translation quietly turns the most
      # consequential control on a screen into its smallest text.
      - name: button + explainer fit report
        run: |
          bash sim/build_fitcheck.sh
          /tmp/kissfit

      # The fit report above measures strings; this measures SCREENS. It builds
      # every wallet screen the scripted walk reaches, in all 21 locales, and
      # asks whether the pixels actually landed where the layout said: text over
      # text, content reaching into the action row, a wrapped label grown into
      # the line below it, or text clipped away where nobody can read it.
      #
      # It landed reporting-only in phase 0, on 385 findings: those were the
      # rendering blockers phase 1 existed to fix, and a gate that blocks before
      # the fix would only block the fix. Phase 1 took it to zero in all 21
      # locales, so OVERLAPCHECK_STRICT is set and a new overlap turns this job
      # red rather than adding a line to a log nobody reads.
      - name: text overlap gate
        run: bash sim/run_overlapcheck.sh
        env:
          OVERLAPCHECK_STRICT: "1"

      # The camera overlay is the one place text is composed by hand rather
      # than drawn by LVGL, because the scan and entropy screens write straight
      # into the camera framebuffer. Nobody can look at that on a desktop, so
      # this renders every overlay string both ways and compares them pixel for
      # pixel. It found two real defects the day it was written.
      - name: overlay text gate
        run: |
          bash sim/build_osdcheck.sh
          /tmp/kissosd

      # Status colours mean things: WT_OK is verified, WT_WARN is caution,
      # WT_STOP is refused. An accent that lands on one of them does not break
      # that meaning, it breaks the hierarchy, and it only shows up in a theme
      # nobody develops in. This measures every accent against every status
      # colour in Lab and fails on any collision that is not declared with the
      # reason it is safe -- and on any declaration that has stopped being
      # true, so the exemptions cannot rot.
      - name: theme safety gate
        run: |
          bash sim/build_themecheck.sh
          /tmp/kisstheme

      - name: setup node for interop rig
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: BlueWallet QR interop round-trip
        run: |
          (cd tools/bw_interop && npm install --no-audit --no-fund)
          bash tools/bw_interop/run.sh
