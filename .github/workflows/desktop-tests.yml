# Desktop test lane: everything that proves correctness WITHOUT hardware or
# the ESP-IDF toolchain, so it runs in ~2 minutes on every push and PR (the
# heavyweight reproducible-build workflow covers the firmware itself).
#
# Each step is a failure mode this project has actually hit:
#   * generator drift  - generated i18n tables/glyph lists out of sync with the
#                        JSONs (a missing glyph hard-hangs LVGL on device)
#   * crypto suite     - BIP39 vector + PSBT parsing against vendored libwally
#   * sim smoke walks  - full scripted UI walk in Latin/CJK/Cyrillic locales;
#                        a rendering hang (missing glyph, heap exhaustion,
#                        layer-alloc loop) shows up as the timeout firing
#   * BlueWallet interop - PSBT round-trip through BlueWallet's real npm QR
#                        stack vs our qr_transport
name: desktop tests

#
# Runs on both branches, because passing this lane is exactly the bar for
# landing on develop: develop is the trunk and must always be green here,
# but green here proves nothing about hardware. main is the release line -
# it only moves on a tagged release that has been run on a real device, and
# that is what reproducible-build.yml publishes hashes for.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      # Full history: the docs freshness check counts commits between the
      # pictures and the screens, and a shallow clone has neither to count.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # EVERY CHECK BELOW THAT NEEDS NOTHING BUILT RUNS, EVEN AFTER ONE FAILS.
      # A step with no `if: always()` is SKIPPED once anything before it goes
      # red, and a skipped step reads exactly like a passing one in the summary
      # a person actually looks at. sim/fitcheck.c stopped COMPILING when
      # 43847834 retired S_WHY_FOOT and left its reference behind; that turned
      # this job red, and for five commits it also silenced twenty two answers
      # that had nothing to do with it -- among them check_sim_taps, which
      # exists to catch a scripted gesture that did nothing and had one waiting.
      #
      # The build and walk chain keeps the default on purpose: those steps
      # genuinely depend on the one before, and running them anyway turns one
      # cause into a wall of consequences, which is its own way of not being
      # read.
      - name: i18n generator drift
        if: always()
        run: |
          python3 tools/gen_i18n.py
          git diff --exit-code -- main/i18n_keys.h main/i18n_tables.c 'tools/fonts/glyphs_*.txt'

      - name: no new unreferenced i18n keys
        if: always()
        run: python3 tools/check_i18n_orphans.py

      - name: the decisions index matches the comments it is built from
        if: always()
        run: python3 tools/gen_decisions.py --check

      - name: the words on screen match the glossary
        if: always()
        run: python3 tools/check_vocab.py

      # tr_reason ends `return r;`, so a refusal it has no entry for shows
      # the C string itself -- developer English, in all 21 locales, on the
      # screen that exists to say why an owner's money is not moving. Three
      # were in that state at once and every gate was green.
      - name: every refusal has words in every language
        if: always()
        run: python3 tools/check_stop_reasons.py

      # Both of these existed, both passed, and NEITHER was invoked by any
      # workflow or build script -- so nothing kept them passing. check_glyphs
      # covers the blind spot kiss_theme.h names twice in its own words: a
      # codepoint missing from the generated fonts draws a blank box about half
      # a line wide, and draws it IDENTICALLY in the simulator, so no frame, no
      # walk and no overlap check has ever had an opinion about it. It is caught
      # on glass or it is not caught.
      # The gate for the gates. Two checkers sat in tools/ that no workflow, no
      # script and no line of CLAUDE.md invoked -- not failing, absent, which
      # looks exactly like green. This asks whether each one is RUN, not
      # whether it is listed.
      - name: every checker in tools/ is run by something
        if: always()
        run: |
          GATECHECK_SELFTEST=1 python3 tools/check_gates.py

      # sim/lv_conf.h overrides five LVGL settings and each one mirrors a
      # Kconfig line the device actually reads. Move one and nothing fails:
      # the sim keeps the old value and every heap number measured in it
      # stops describing the firmware. The pair has no other keeper.
      - name: the sim's LVGL config still matches the device's
        if: always()
        run: |
          LVCONF_SELFTEST=1 python3 tools/check_lv_conf.py

      - name: crypto tests (BIP39 vector + PSBT suite)
        run: |
          bash sim/build_test.sh
          /tmp/kisstest | tee /tmp/kisstest.log
          grep -q "PASS: BIP39 test vector -> 73C5DA0A" /tmp/kisstest.log

      # tools/nvs_seed_check.sh is the only thing that can say whether REPLACE
      # actually destroyed the words it replaced: NVS is log structured, so an
      # erased key is two bitmap bits and the sealed blob stays on its page
      # until a compaction that may never come. Nothing in the simulator has
      # NVS at all, so this ran by hand or not at all -- and a forensic tool
      # nobody re-runs is one whose false clean answer nobody notices.
      #
      # The fixture is an NVS page built byte for byte in the test, so there is
      # no esptool, no device and no third-party package: stdlib plus the
      # libcrypto Python already links. It authenticates and decrypts the
      # sealed blob the same way the device does and checks the BIP39 sum, so
      # a format drift in main/kiss_seed_sd.c turns this red.
      #
      # The second test stands a fake esptool in front of the check script, so
      # the half that used to need a board -- the partition table walk, the CSV
      # fallback an encrypted board falls into, which ranges get read at all --
      # is exercised here too. Only the USB layer and whether real NVS matches
      # the format still need hardware.
      - name: NVS forensic scanner (offline fixture)
        run: |
          python3 tools/test_nvs_seed_scan.py | tee /tmp/kissnvs.log
          grep -q "PASS: recovery survives damaged NVS metadata" /tmp/kissnvs.log
          bash tools/test_nvs_seed_check.sh | tee /tmp/kissnvscheck.log
          grep -q "PASS: nvs_seed_check.sh plumbing" /tmp/kissnvscheck.log

      # The harness had silently stopped building (a source file was added to
      # the device component and never to the fuzz link line), so nobody
      # noticed it was gone. It only stays honest if CI runs it.
      - name: parser fuzz (ASAN + UBSAN)
        run: |
          bash sim/build_fuzz.sh
          /tmp/kissfuzz | tee /tmp/kissfuzz.log
          grep -q "ALL FUZZ PASS" /tmp/kissfuzz.log

      # managed_components/ is gitignored (the IDF component manager populates
      # it during device builds), so fetch LVGL ourselves at the exact version
      # dependencies.lock pins for the device.
      # if: always(), because the two steps BELOW have it -- the same
      # reasoning the SDL2 install carries further down. Guarding a check
      # and not what it needs is how a log ends on a missing dependency
      # instead of the failure that caused it.
      - name: fetch LVGL for the sim
        if: always()
        run: |
          LV=$(awk '/^  lvgl\/lvgl:/{f=1} f&&/version:/{print $2; exit}' dependencies.lock)
          echo "dependencies.lock pins lvgl/lvgl $LV"
          git clone -q -c advice.detachedHead=false --depth 1 --branch "v$LV" \
            https://github.com/lvgl/lvgl.git managed_components/lvgl__lvgl

      # AFTER the fetch, and that is the whole reason it sits here rather than
      # up with the other python checks: check_glyphs.py reads LVGL's own
      # lv_symbol_def.h out of managed_components, which is gitignored and does
      # not exist until the clone above. Wired in above it, the gate died
      # FileNotFoundError on its first run, every later step without
      # `if: always()` was SKIPPED -- the fetch among them -- and the four that
      # do carry it failed on the LVGL nothing had cloned. Six red steps and
      # one cause, none of them the step that broke.
      - name: every icon the firmware names is in the fonts
        if: always()
        run: |
          GLYPHCHECK_SELFTEST=1 python3 tools/check_glyphs.py
          python3 tools/check_mono_glyphs.py

      # ENGLISH ONLY while the UI is being rebuilt, for the reason CLAUDE.md
      # gives and with the cost it names. Every screen that gets rebuilt
      # rewrites its own strings, so the other twenty carry wording that is
      # about to be thrown away -- and the walk asserts on that wording, so ja
      # and ru have been failing on stale copy rather than on the product.
      #
      # A standing red is worse than no gate. It trains everyone to scroll
      # past, which is how the parser fuzz step sat broken for a day after the
      # BIP39 test vector was allowed and its assertions were only flipped in
      # one of the two harnesses that make them.
      #
      # What this gives up, stated so nobody has to rediscover it: a walk
      # needle that passes in English because two keys share a string there
      # and differ in French is exactly the class these two caught, and it now
      # waits for the translation sweep. Put ja and ru back the day the
      # wording settles.
      # if: always(), because check_sim_taps below reads the frames this
      # step writes. Skipped, it leaves that check with nothing to compare.
      - name: sim smoke walk (en)
        if: always()
        run: |
          bash sim/build_sim.sh
          for L in en; do
            echo "== SIM_LANG=$L =="
            timeout 300 env SIM_LANG=$L /tmp/fruitsim > /tmp/sim_$L.log
            tail -1 /tmp/sim_$L.log
          done

      # The fuzz harness runs the parsers under ASAN, which is where untrusted
      # bytes arrive -- but nothing had ever run the SCREENS under it, and the
      # UI files are wall to wall char buf[N] + snprintf/memcpy. Same flags,
      # one locale, and its own binary so the frames above are not overwritten.
      #
      # It cannot see LVGL: sim/lv_conf.h allocates every widget out of a 128 KB
      # static pool, so ASAN has no redzone to place on any of them. Stack
      # buffers, static arrays and UBSAN over the layout arithmetic are what
      # this buys.
      - name: sanitized walk (ASAN + UBSAN, en)
        run: |
          export KISS_SIM_TMP=/tmp/kiss-san
          KISS_SAN=1 bash sim/build_sim.sh
          timeout 600 env SIM_LANG=en /tmp/kiss-san/fruitsim > /tmp/kiss-san/walk.log
          tail -1 /tmp/kiss-san/walk.log

      # The walk drives the UI with hardcoded touch coordinates. When a layout
      # moves, a tap lands on background: the frame still saves, it is just a
      # copy of the one before, and the walk still "passes". That is how the
      # 2min->5min auto-lock change left the wipe and amnesic-mode steps dead
      # for four commits. Identical consecutive frames mean a dead interaction.
      - name: simulator taps still hit something
        if: always()
        run: python3 tools/check_sim_taps.py

      # The PUBLISHED simulator is the first link a visitor clicks, and the
      # README says its screenshots come from the real firmware sources. That
      # claim can only be kept by a machine, and it was not: the committed
      # bundle drew SETTINGS as four sans pill rows months after the page had
      # been building five ruled rows with lamps.
      #
      # Not a hash compare against a rebuild. tools/build_wasm.sh is byte
      # reproducible for ONE compiler -- that is what its -g0 is for -- and a
      # laptop and a runner do not share an emsdk, so a hash gate goes red
      # forever the day either one moves. This asks whether the committed
      # binary contains the strings this tree ships, which needs no toolchain
      # at all and catches the failure that actually happened.
      - name: the published simulator is from this tree
        if: always()
        run: python3 tools/check_sim_fresh.py

      # The step above asks whether a tap changed the screen. This asks the
      # question none of the others can: which screens has nothing ever looked
      # at. overlapcheck puts seven questions to every STOP, so a screen with no
      # stop has no opinion attached to it -- whatseed_open was a wall of text on
      # the screen a newcomer opens to learn what a seed is, for its entire life,
      # with every gate green, because no stop rendered it. It was found by
      # accident on the day it got one.
      #
      # It ran by hand only, which is the same failure one level up: a gate
      # nobody runs is a gate that reports nothing. The script self tests before
      # reporting and refuses to report if the check stops firing, so a line
      # here means the check ran, not merely that it found nothing.
      #
      # Strict AND blocking. Two things are reported: screens the walk never
      # opens (NEVER OPENED), and screens it opens but never photographs
      # (UNCHECKED, the walk's own "built and never captured" report). The
      # second one has already caught a real miss -- a firmware-rejected stop
      # saved its frame before the deferred result screen landed, so the walk
      # reached the screen and no gate asked it anything. Both fail the job
      # under SCREENCOVER_STRICT. The selftest path used to hang intermittently
      # on the desktop, which is why this step was once non-blocking; a hung
      # walk now fails the job by burning its timeout, which is the honest
      # answer -- a run that cannot say it looked at everything is a run that
      # looked at nothing.
      #
      # 300 is a HANG detector, not a duration budget, so it stays 300. It was
      # proposed for 900 on the grounds that the walk gained two 8200-frame
      # idle sections; measured, one walk is 9.3s and this script -- which
      # re-drives it for the selftest and for every non-OK safe-boot status --
      # is 18.5s, so 300 is already ~16x, and ~4x on a runner four times
      # slower. Raising it would only make a wedged walk take fifteen minutes
      # to say so instead of five. Measure before moving it.
      - name: every screen has a walk stop (strict, enforced)
        env:
          SCREENCOVER_STRICT: "1"
        run: timeout 300 python3 tools/check_screen_coverage.py

      # A geometry read before the layout that produces it returns 0, and a
      # zero that falls through an `if` is indistinguishable from a case that
      # needed no handling -- which is how wt_def_row_help's whole body was a
      # no-op for its entire life with every rendering gate green.
      - name: no measurement before its layout
        if: always()
        run: |
          python3 tools/check_layout_reads.py --selftest
          python3 tools/check_layout_reads.py

      # The walkthrough's screenshots are simulator frames, so a renamed or
      # deleted save() in sim_main.c silently orphans a picture in the docs.
      # This checks the manifest still resolves; it deliberately does not
      # compare pixels, because zlib versions differ and a flaky docs job
      # teaches people to ignore the docs job.
      - name: docs screenshots manifest
        if: always()
        run: python3 tools/gen_docs_shots.py --check

      # The manifest above proves every picture still resolves to a frame. It
      # says nothing about whether the frame is current, and that is the half
      # that rotted: the shots sat at Aug 30 while develop changed a screen 21
      # more times. This counts that gap and prints it. It does NOT fail here
      # -- a regeneration is a simulator build and forty two binaries, so it
      # belongs at the end of a batch, not in every UI commit. It fails on the
      # way to main, where a stale picture is what ships.
      - name: docs freshness
        if: always()
        run: |
          python3 tools/check_docs_fresh.py --selftest
          python3 tools/check_docs_fresh.py

      # Same discipline as the screenshot manifest above, applied to the thing
      # that writes firmware to people's devices. docs/installer/ is generated
      # by tools/make_web_release.sh and nothing regenerates it automatically,
      # so it goes stale the moment VERSION moves. Between beta6 and beta7 the
      # site served beta6 while every document described beta7. Fails only when
      # the page still offers the button, since a pulled button flashes nothing.
      - name: installer artifacts match VERSION
        run: python3 tools/check_installer_version.py

      # The committed firmware binary is 7.5 MB of bytes that CI never rebuilt
      # and never hashed. Everything else about a release was checked except
      # whether the file we ship is the file we signed, so a PR that swapped
      # those bytes shipped them. This binds the committed binary to
      # release.json, to the signed SHA256SUMS, and the signature to the
      # committed key, on every PR.
      - name: committed installer firmware matches what was signed
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          inst = pathlib.Path("docs/installer")
          meta = json.loads((inst / "release.json").read_text())
          bf = meta["browserFirmware"]
          blob = (inst / bf["path"]).read_bytes()
          bad = []
          if len(blob) != bf["size"]:
              bad.append(f"size {len(blob)} != release.json {bf['size']}")
          got = hashlib.sha256(blob).hexdigest()
          if got != bf["sha256"]:
              bad.append(f"sha256 {got} != release.json {bf['sha256']}")
          # SHA256SUMS names the GitHub Release asset, not the staging path.
          want = dict(
              (line.split("  ")[1].strip(), line.split("  ")[0])
              for line in (inst / "SHA256SUMS").read_text().splitlines() if line.strip()
          )
          asset = pathlib.Path(bf["path"]).name
          if asset not in want:
              bad.append(f"SHA256SUMS does not list {asset}")
          elif want[asset] != got:
              bad.append(f"SHA256SUMS says {want[asset]} for {asset}, file hashes {got}")
          for problem in bad:
              print("FAIL ", problem)
          sys.exit(1 if bad else 0)
          PY
          cd docs/installer
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --import kiss_signer_pgp.asc
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
          # The signature must be from the key release.json names, not merely
          # from some key we happen to have imported.
          want=$(python3 -c "import json;print(json.load(open('release.json'))['authenticity']['gpgFingerprint'])")
          gpg --batch --with-colons --show-keys kiss_signer_pgp.asc \
            | awk -F: '/^fpr:/{print $10; exit}' | grep -qx "$want" \
            || { echo "FAIL  kiss_signer_pgp.asc is not $want"; exit 1; }
          echo "PASS: committed firmware matches release.json and the signed SHA256SUMS"

      # Every SHA256SUMS line must VERIFY with the standard tool, run the way
      # the README tells users to run it. The old annotated format parsed fine
      # here and verified nothing: to sha256sum -c the annotation is part of
      # the filename, and --ignore-missing skipped every such line with exit 0
      # on every release since the format shipped. Files are staged flat, the
      # way a release download folder looks, and the OK count closes the
      # skipped-line hole. Annotated lines from the last pre-fix release are
      # warned and excluded until the next release regenerates the file (its
      # generator can no longer emit them, and make_web_release.sh hard-fails
      # at release time if one ever comes back); bare lines get no mercy.
      - name: SHA256SUMS verifies line for line
        run: |
          set -e
          stage=$(mktemp -d)
          bare=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            if [ "$(echo "$line" | awk '{print NF}')" -gt 2 ]; then
              echo "WARN: legacy annotated line, unverifiable, excluded: $line"
              continue
            fi
            file=$(echo "$line" | awk '{print $2}')
            src=$(find docs/installer -name "$file" -type f | head -1)
            [ -n "$src" ] || { echo "FAIL: SHA256SUMS lists $file but docs/installer has no such file"; exit 1; }
            cp "$src" "$stage/"
            echo "$line" >> "$stage/SHA256SUMS"
            bare=$((bare + 1))
          done < docs/installer/SHA256SUMS
          [ "$bare" -gt 0 ] || { echo "FAIL: SHA256SUMS has no verifiable lines at all"; exit 1; }
          cd "$stage"
          sha256sum -c SHA256SUMS
          ok=$(sha256sum -c SHA256SUMS | grep -c ': OK$')
          [ "$ok" = "$bare" ] || { echo "FAIL: $bare verifiable lines, only $ok verified"; exit 1; }
          echo "PASS: all $ok verifiable SHA256SUMS lines check out"

      # The offline installer zip is built at release time and never in CI, and
      # the page inside it is never loaded here, so a new <img> on docs/index.html
      # would ship a bundle with a hole in it and every other check would stay
      # green. This compares what the pages actually load against what the zip
      # packs. Deliberately does not look at VERSION: that is the check above,
      # and it tolerates the window where a release is staged.
      - name: offline installer packs everything the page loads
        run: python3 tools/make_offline_zip.py --check

      # The camera overlay glyph-coverage check used to live here. It read the
      # desktop TTFs the strips were baked from and named any character they
      # lacked, which is how every Russian overlay, plus Vietnamese, Croatian
      # and Czech diacritics, had shipped as tofu boxes. There is nothing left
      # for it to read: the overlay now composes from the same font_kiss faces
      # every other screen uses, so its coverage is the coverage the font
      # generator and sim/fitcheck.c already gate. The overlay text gate below
      # replaces it, and does more.

      # Type-size ratchet. Fails when a button the user must READ to act
      # correctly (sign, wipe, replace, verify) renders at font14 in ANY of the
      # 21 locales, which is how a translation quietly turns the most
      # consequential control on a screen into its smallest text.
      # ENGLISH ONLY while the UI is being rebuilt, for the same reason and with
      # the same cost as the smoke walk above. This gate measures whether a
      # string fits its box, and the other twenty locales are carrying strings
      # that are about to be replaced: five screen titles and 69 slots fail on
      # TRANSLATION LENGTH, on lanes and copy this pass never touched, and the
      # English-only rule says a wording fix made now is thrown away when the
      # screens stop moving.
      #
      # It stays a 21-locale gate in the tool -- run /tmp/kissfit with no
      # SIM_LANG to get the full sweep, and it is the translation pass's own
      # gate. Put the sweep back here the day the wording settles; the fit of a
      # long translation is exactly what this check is for and giving it up is
      # not free.

      # ALWAYS, from here down. These six build their own binary and prove one
      # thing each, so nothing below depends on the one above it -- and the job
      # stopping at the first red step is what let three faults hide behind one
      # another on 2026-08-30. The overlap gate was failing on translations, so
      # the SD fixture checker never ran; when that was fixed the checker turned
      # out not to LINK, and fixing that uncovered the interactive simulator not
      # linking either. Each was a one line source list, each had been broken for
      # as long as the call it was missing had existed, and each cost a push and
      # a six minute run to find because the job reported one fault at a time.
      #
      # The job still fails on any of them. What changes is that it reports all
      # of them at once.
      - name: button + explainer fit report (en)
        if: always()
        run: |
          bash sim/build_fitcheck.sh
          SIM_LANG=en /tmp/kissfit

      # The fit report above measures strings; this measures SCREENS. It builds
      # every wallet screen the scripted walk reaches, in all 21 locales, and
      # asks whether the pixels actually landed where the layout said: text over
      # text, content reaching into the action row, a wrapped label grown into
      # the line below it, or text clipped away where nobody can read it.
      #
      # It landed reporting-only in phase 0, on 385 findings: those were the
      # rendering blockers phase 1 existed to fix, and a gate that blocks before
      # the fix would only block the fix. Phase 1 took it to zero in all 21
      # locales, so OVERLAPCHECK_STRICT is set and a new overlap turns this job
      # red rather than adding a line to a log nobody reads.
      # ENGLISH ONLY while the UI is being rebuilt, the third gate to take that
      # treatment today and for the same reason as the smoke walk and the fit
      # report. This one sweeps 21 locales, and the twenty that are not English
      # carry wording about to be replaced: their walks die on needles that
      # match a string the sweep has not written yet, and the script correctly
      # refuses to report a dead walk as clean.
      #
      # STRICT stays on, so a new overlap in English still turns this job red.
      # What is given up is the class this gate is best at -- a label that fits
      # in English and not in German -- and it comes back in one line the day
      # the wording settles.
      - name: text overlap gate (en)
        if: always()
        run: OVERLAPCHECK_LANGS=en OVERLAPCHECK_STRICT=1 bash sim/run_overlapcheck.sh
        env:
          OVERLAPCHECK_STRICT: "1"

      # The camera overlay is the one place text is composed by hand rather
      # than drawn by LVGL, because the scan and entropy screens write straight
      # into the camera framebuffer. Nobody can look at that on a desktop, so
      # this renders every overlay string both ways and compares them pixel for
      # pixel. It found two real defects the day it was written.
      # ENGLISH ONLY, same rule as the three gates above. Across 21 locales this
      # is RED on one Italian string at font28 -- 1037px of a 1000px canvas --
      # which sim/osdcheck.c names beside its own SIM_LANG filter as a
      # translation waiting for the sweep. Nothing about the product.
      - name: overlay text gate (en)
        if: always()
        run: |
          bash sim/build_osdcheck.sh
          SIM_LANG=en /tmp/kissosd

      # Status colours mean things: WT_OK is verified, WT_WARN is caution,
      # WT_STOP is refused. An accent that lands on one of them does not break
      # that meaning, it breaks the hierarchy, and it only shows up in a theme
      # nobody develops in. This measures every accent against every status
      # colour in Lab and fails on any collision that is not declared with the
      # reason it is safe -- and on any declaration that has stopped being
      # true, so the exemptions cannot rot.
      - name: theme safety gate
        if: always()
        run: |
          bash sim/build_themecheck.sh
          /tmp/kisstheme

      - name: setup node for interop rig
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: BlueWallet QR interop round-trip
        run: |
          (cd tools/bw_interop && npm install --no-audit --no-fund)
          bash tools/bw_interop/run.sh

      # The PSBT fixtures are the ones carried to the device on a card, and the
      # verdict each one is built to produce (READY / CAUTION / STOP, and which
      # caution flags) is the contract the verify screen renders. Emitting them
      # and reading them back through the device's own kiss_psbt.c is a full
      # round trip, and it also pins the signature the amount proof must not
      # change -- ba46442b, the hash the device test is checked against.
      #
      # LAST, and that is the whole reason it is down here rather than beside
      # the other sim gates. These binaries link kiss_seed.c, kiss_seed_sd.c and
      # platform_sd.c, which own a pile of hardcoded host paths -- /tmp/simsd,
      # /tmp/kiss_seed*.txt, /tmp/kiss_device_key.bin -- with no override
      # between them. Run before the screen walk, the state they leave HANGS it:
      # not a failure, a hang, which in CI is a job that burns its timeout with
      # nothing printed. Deleting /tmp/simsd afterwards is not enough; it was
      # tried and the walk still hung. Ordering is the fix that does not depend
      # on knowing which of those paths did it.
      #
      # So: nothing below this line may drive /tmp/fruitsim or /tmp/kissoverlap.
      - name: SD PSBT fixtures still reach their verdicts
        if: always()
        run: |
          rm -rf /tmp/ci_sd_psbts && mkdir -p /tmp/ci_sd_psbts
          bash sim/mk_sd_psbts.sh /tmp/ci_sd_psbts
          bash sim/check_sd_psbts.sh /tmp/ci_sd_psbts

      # The interactive simulator, and the only gate that compiles the UI and
      # libwally into one binary. Neither of the other two link lines would
      # notice it breaking: build_sim.sh fakes the crypto, build_test.sh has no
      # screens. The browser build is the same sources through emcc, differing
      # only inside its own #ifdef, so guarding this one guards both without
      # putting a 1GB emsdk install on every push.
      #
      # Down here with the SD fixtures for the same reason they are: /tmp/kissapp
      # links kiss_seed.c and platform_sd.c and writes the same hardcoded host
      # paths, so it must not run before the screen walk.
      # if: always(), because the step BELOW has it. Without it a failure
      # anywhere earlier in this job skips the install and then runs the build
      # that needs it, so the log's last word is "sdl2-config: command not
      # found" -- a missing dependency, reported instead of the real failure
      # twenty lines up. It cost the first read of exactly that log.
      - name: SDL2 for the interactive simulator
        if: always()
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev

      - name: interactive simulator builds and boots
        if: always()
        run: |
          bash sim/build_simapp.sh
          rm -rf /tmp/simsd
          rm -f /tmp/kiss_seed.txt /tmp/kiss_seed_mode.txt /tmp/kiss_seed_entq.txt \
                /tmp/kiss_device_key.bin /tmp/kiss_flash_key.bin
          SDL_VIDEODRIVER=dummy /tmp/kissapp --frames 40 --shot /tmp/kissapp.ppm
          test -s /tmp/kissapp.ppm || { echo "FAIL: the app rendered nothing"; exit 1; }
          echo "ok: $(wc -c < /tmp/kissapp.ppm) bytes of frame"
