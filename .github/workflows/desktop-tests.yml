# Desktop test lane: everything that proves correctness WITHOUT hardware or
# the ESP-IDF toolchain, so it runs in ~2 minutes on every push and PR (the
# heavyweight reproducible-build workflow covers the firmware itself).
#
# Each step is a failure mode this project has actually hit:
#   * generator drift  - generated i18n tables/glyph lists out of sync with the
#                        JSONs (a missing glyph hard-hangs LVGL on device)
#   * crypto suite     - BIP39 vector + PSBT parsing against vendored libwally
#   * sim smoke walks  - full scripted UI walk in Latin/CJK/Cyrillic locales;
#                        a rendering hang (missing glyph, heap exhaustion,
#                        layer-alloc loop) shows up as the timeout firing
#   * BlueWallet interop - PSBT round-trip through BlueWallet's real npm QR
#                        stack vs our qr_transport
name: desktop tests

#
# Runs on both branches, because passing this lane is exactly the bar for
# landing on develop: develop is the trunk and must always be green here,
# but green here proves nothing about hardware. main is the release line -
# it only moves on a tagged release that has been run on a real device, and
# that is what reproducible-build.yml publishes hashes for.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: i18n generator drift
        run: |
          python3 tools/gen_i18n.py
          git diff --exit-code -- main/i18n_keys.h main/i18n_tables.c 'tools/fonts/glyphs_*.txt'

      - name: verify page drift
        run: |
          python3 tools/gen_verify_page.py
          git diff --exit-code -- main/verify_page.c main/verify_page.h

      # The page's JS, the firmware's C and verify_proof.py all implement
      # BIP39(SHA256(file)); this runs the page's actual script body against
      # the same pinned vector sim/test_proof.c uses, so they cannot drift.
      - name: verify page vector (node)
        run: node tools/check_verify_page.mjs

      - name: crypto tests (BIP39 vector + PSBT suite)
        run: |
          bash sim/build_test.sh
          /tmp/kisstest | tee /tmp/kisstest.log
          grep -q "PASS: BIP39 test vector -> 73C5DA0A" /tmp/kisstest.log

      # The harness had silently stopped building (a source file was added to
      # the device component and never to the fuzz link line), so nobody
      # noticed it was gone. It only stays honest if CI runs it.
      - name: parser fuzz (ASAN + UBSAN)
        run: |
          bash sim/build_fuzz.sh
          /tmp/kissfuzz | tee /tmp/kissfuzz.log
          grep -q "ALL FUZZ PASS" /tmp/kissfuzz.log

      # managed_components/ is gitignored (the IDF component manager populates
      # it during device builds), so fetch LVGL ourselves at the exact version
      # dependencies.lock pins for the device.
      - name: fetch LVGL for the sim
        run: |
          LV=$(awk '/^  lvgl\/lvgl:/{f=1} f&&/version:/{print $2; exit}' dependencies.lock)
          echo "dependencies.lock pins lvgl/lvgl $LV"
          git clone -q -c advice.detachedHead=false --depth 1 --branch "v$LV" \
            https://github.com/lvgl/lvgl.git managed_components/lvgl__lvgl

      - name: sim smoke walks (en / ja / ru)
        run: |
          bash sim/build_sim.sh
          for L in en ja ru; do
            echo "== SIM_LANG=$L =="
            timeout 300 env SIM_LANG=$L /tmp/fruitsim > /tmp/sim_$L.log
            tail -1 /tmp/sim_$L.log
          done

      # The walk drives the UI with hardcoded touch coordinates. When a layout
      # moves, a tap lands on background: the frame still saves, it is just a
      # copy of the one before, and the walk still "passes". That is how the
      # 2min->5min auto-lock change left the wipe and amnesic-mode steps dead
      # for four commits. Identical consecutive frames mean a dead interaction.
      - name: simulator taps still hit something
        run: python3 tools/check_sim_taps.py

      # The step above asks whether a tap changed the screen. This asks the
      # question none of the others can: which screens has nothing ever looked
      # at. overlapcheck puts seven questions to every STOP, so a screen with no
      # stop has no opinion attached to it -- whatseed_open was a wall of text on
      # the screen a newcomer opens to learn what a seed is, for its entire life,
      # with every gate green, because no stop rendered it. It was found by
      # accident on the day it got one.
      #
      # It ran by hand only, which is the same failure one level up: a gate
      # nobody runs is a gate that reports nothing. The script self tests before
      # reporting and refuses to report if the check stops firing, so a line
      # here means the check ran, not merely that it found nothing.
      #
      # Reporting-only, bounded, and NOT strict yet, which is deliberate and
      # temporary. The count of uncovered screens is zero today and STRICT was
      # the intent -- but the walk's own self test path (SCREENCOVER_SELFTEST=1
      # /tmp/fruitsim) hangs intermittently on the desktop: it completed a dozen
      # times in a row and then stopped returning at all, with /tmp clean and no
      # stray process holding it. That is a hang, not a failure, so a strict
      # gate would burn the job's whole timeout with nothing printed, at random.
      #
      # The hang is not this script's and it is not new here -- the script only
      # started SAYING so once it learned to check the return code. Bound it,
      # report it, and turn STRICT on in the commit that fixes the hang, not
      # before. A gate that goes red for reasons nobody can reproduce is how a
      # team learns to ignore a red gate.
      # STRICT is set NOW, continue-on-error stays. The two do different jobs
      # and only one of them was ever the blocker: without STRICT the script
      # exits 0 no matter what it finds, so dropping continue-on-error alone
      # would have changed nothing at all -- the lever is here, and the log
      # was the thing that had gone quiet. STRICT makes the step SAY FAILED
      # and name the uncovered screens; continue-on-error keeps the
      # unreproducible selftest hang from turning that into a red gate nobody
      # trusts. Remove continue-on-error in the commit that fixes the hang,
      # which is what the note above promised and could not deliver.
      - name: every screen has a walk stop (strict, reported not enforced)
        continue-on-error: true
        env:
          SCREENCOVER_STRICT: "1"
        run: timeout 300 python3 tools/check_screen_coverage.py

      # The walkthrough's screenshots are simulator frames, so a renamed or
      # deleted save() in sim_main.c silently orphans a picture in the docs.
      # This checks the manifest still resolves; it deliberately does not
      # compare pixels, because zlib versions differ and a flaky docs job
      # teaches people to ignore the docs job.
      - name: docs screenshots manifest
        run: python3 tools/gen_docs_shots.py --check

      # Same discipline as the screenshot manifest above, applied to the thing
      # that writes firmware to people's devices. docs/installer/ is generated
      # by tools/make_web_release.sh and nothing regenerates it automatically,
      # so it goes stale the moment VERSION moves. Between beta6 and beta7 the
      # site served beta6 while every document described beta7. Fails only when
      # the page still offers the button, since a pulled button flashes nothing.
      - name: installer artifacts match VERSION
        run: python3 tools/check_installer_version.py

      # The committed firmware binary is 7.5 MB of bytes that CI never rebuilt
      # and never hashed. Everything else about a release was checked except
      # whether the file we ship is the file we signed, so a PR that swapped
      # those bytes shipped them. This binds the committed binary to
      # release.json, to the signed SHA256SUMS, and the signature to the
      # committed key, on every PR.
      - name: committed installer firmware matches what was signed
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          inst = pathlib.Path("docs/installer")
          meta = json.loads((inst / "release.json").read_text())
          bf = meta["browserFirmware"]
          blob = (inst / bf["path"]).read_bytes()
          bad = []
          if len(blob) != bf["size"]:
              bad.append(f"size {len(blob)} != release.json {bf['size']}")
          got = hashlib.sha256(blob).hexdigest()
          if got != bf["sha256"]:
              bad.append(f"sha256 {got} != release.json {bf['sha256']}")
          # SHA256SUMS names the GitHub Release asset, not the staging path.
          want = dict(
              (line.split("  ")[1].strip(), line.split("  ")[0])
              for line in (inst / "SHA256SUMS").read_text().splitlines() if line.strip()
          )
          asset = pathlib.Path(bf["path"]).name
          if asset not in want:
              bad.append(f"SHA256SUMS does not list {asset}")
          elif want[asset] != got:
              bad.append(f"SHA256SUMS says {want[asset]} for {asset}, file hashes {got}")
          for problem in bad:
              print("FAIL ", problem)
          sys.exit(1 if bad else 0)
          PY
          cd docs/installer
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --import kiss_signer_pgp.asc
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
          # The signature must be from the key release.json names, not merely
          # from some key we happen to have imported.
          want=$(python3 -c "import json;print(json.load(open('release.json'))['authenticity']['gpgFingerprint'])")
          gpg --batch --with-colons --show-keys kiss_signer_pgp.asc \
            | awk -F: '/^fpr:/{print $10; exit}' | grep -qx "$want" \
            || { echo "FAIL  kiss_signer_pgp.asc is not $want"; exit 1; }
          echo "PASS: committed firmware matches release.json and the signed SHA256SUMS"

      # Every SHA256SUMS line must VERIFY with the standard tool, run the way
      # the README tells users to run it. The old annotated format parsed fine
      # here and verified nothing: to sha256sum -c the annotation is part of
      # the filename, and --ignore-missing skipped every such line with exit 0
      # on every release since the format shipped. Files are staged flat, the
      # way a release download folder looks, and the OK count closes the
      # skipped-line hole. Annotated lines from the last pre-fix release are
      # warned and excluded until the next release regenerates the file (its
      # generator can no longer emit them, and make_web_release.sh hard-fails
      # at release time if one ever comes back); bare lines get no mercy.
      - name: SHA256SUMS verifies line for line
        run: |
          set -e
          stage=$(mktemp -d)
          bare=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            if [ "$(echo "$line" | awk '{print NF}')" -gt 2 ]; then
              echo "WARN: legacy annotated line, unverifiable, excluded: $line"
              continue
            fi
            file=$(echo "$line" | awk '{print $2}')
            src=$(find docs/installer -name "$file" -type f | head -1)
            [ -n "$src" ] || { echo "FAIL: SHA256SUMS lists $file but docs/installer has no such file"; exit 1; }
            cp "$src" "$stage/"
            echo "$line" >> "$stage/SHA256SUMS"
            bare=$((bare + 1))
          done < docs/installer/SHA256SUMS
          [ "$bare" -gt 0 ] || { echo "FAIL: SHA256SUMS has no verifiable lines at all"; exit 1; }
          cd "$stage"
          sha256sum -c SHA256SUMS
          ok=$(sha256sum -c SHA256SUMS | grep -c ': OK$')
          [ "$ok" = "$bare" ] || { echo "FAIL: $bare verifiable lines, only $ok verified"; exit 1; }
          echo "PASS: all $ok verifiable SHA256SUMS lines check out"

      # The offline installer zip is built at release time and never in CI, and
      # the page inside it is never loaded here, so a new <img> on docs/index.html
      # would ship a bundle with a hole in it and every other check would stay
      # green. This compares what the pages actually load against what the zip
      # packs. Deliberately does not look at VERSION: that is the check above,
      # and it tolerates the window where a release is staged.
      - name: offline installer packs everything the page loads
        run: python3 tools/make_offline_zip.py --check

      # The camera overlay glyph-coverage check used to live here. It read the
      # desktop TTFs the strips were baked from and named any character they
      # lacked, which is how every Russian overlay, plus Vietnamese, Croatian
      # and Czech diacritics, had shipped as tofu boxes. There is nothing left
      # for it to read: the overlay now composes from the same font_kiss faces
      # every other screen uses, so its coverage is the coverage the font
      # generator and sim/fitcheck.c already gate. The overlay text gate below
      # replaces it, and does more.

      # Type-size ratchet. Fails when a button the user must READ to act
      # correctly (sign, wipe, replace, verify) renders at font14 in ANY of the
      # 21 locales, which is how a translation quietly turns the most
      # consequential control on a screen into its smallest text.
      - name: button + explainer fit report
        run: |
          bash sim/build_fitcheck.sh
          /tmp/kissfit

      # The fit report above measures strings; this measures SCREENS. It builds
      # every wallet screen the scripted walk reaches, in all 21 locales, and
      # asks whether the pixels actually landed where the layout said: text over
      # text, content reaching into the action row, a wrapped label grown into
      # the line below it, or text clipped away where nobody can read it.
      #
      # It landed reporting-only in phase 0, on 385 findings: those were the
      # rendering blockers phase 1 existed to fix, and a gate that blocks before
      # the fix would only block the fix. Phase 1 took it to zero in all 21
      # locales, so OVERLAPCHECK_STRICT is set and a new overlap turns this job
      # red rather than adding a line to a log nobody reads.
      - name: text overlap gate
        run: bash sim/run_overlapcheck.sh
        env:
          OVERLAPCHECK_STRICT: "1"

      # The camera overlay is the one place text is composed by hand rather
      # than drawn by LVGL, because the scan and entropy screens write straight
      # into the camera framebuffer. Nobody can look at that on a desktop, so
      # this renders every overlay string both ways and compares them pixel for
      # pixel. It found two real defects the day it was written.
      - name: overlay text gate
        run: |
          bash sim/build_osdcheck.sh
          /tmp/kissosd

      # Status colours mean things: WT_OK is verified, WT_WARN is caution,
      # WT_STOP is refused. An accent that lands on one of them does not break
      # that meaning, it breaks the hierarchy, and it only shows up in a theme
      # nobody develops in. This measures every accent against every status
      # colour in Lab and fails on any collision that is not declared with the
      # reason it is safe -- and on any declaration that has stopped being
      # true, so the exemptions cannot rot.
      - name: theme safety gate
        run: |
          bash sim/build_themecheck.sh
          /tmp/kisstheme

      - name: setup node for interop rig
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: BlueWallet QR interop round-trip
        run: |
          (cd tools/bw_interop && npm install --no-audit --no-fund)
          bash tools/bw_interop/run.sh

      # The PSBT fixtures are the ones carried to the device on a card, and the
      # verdict each one is built to produce (READY / CAUTION / STOP, and which
      # caution flags) is the contract the verify screen renders. Emitting them
      # and reading them back through the device's own kiss_psbt.c is a full
      # round trip, and it also pins the signature the amount proof must not
      # change -- ba46442b, the hash the device test is checked against.
      #
      # LAST, and that is the whole reason it is down here rather than beside
      # the other sim gates. These binaries link kiss_seed.c, kiss_seed_sd.c and
      # platform_sd.c, which own a pile of hardcoded host paths -- /tmp/simsd,
      # /tmp/kiss_seed*.txt, /tmp/kiss_device_key.bin -- with no override
      # between them. Run before the screen walk, the state they leave HANGS it:
      # not a failure, a hang, which in CI is a job that burns its timeout with
      # nothing printed. Deleting /tmp/simsd afterwards is not enough; it was
      # tried and the walk still hung. Ordering is the fix that does not depend
      # on knowing which of those paths did it.
      #
      # So: nothing below this line may drive /tmp/fruitsim or /tmp/kissoverlap.
      - name: SD PSBT fixtures still reach their verdicts
        run: |
          rm -rf /tmp/ci_sd_psbts && mkdir -p /tmp/ci_sd_psbts
          bash sim/mk_sd_psbts.sh /tmp/ci_sd_psbts
          bash sim/check_sd_psbts.sh /tmp/ci_sd_psbts
