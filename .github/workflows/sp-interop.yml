name: Silent Payment interoperability

on:
  workflow_call:
    inputs:
      bdk_ref:
        description: Coordinator commit or ref to test
        type: string
        default: main
  workflow_dispatch:
    inputs:
      bdk_ref:
        description: Coordinator commit or ref to test
        type: string
        default: main

permissions:
  contents: read

env:
  NODE_OPTIONS: --use-openssl-ca
  CARGO_TERM_COLOR: always

jobs:
  sp-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: signer
          persist-credentials: false
      - name: Prepare TLS trust for downloads
        run: python3 signer/.github/scripts/with_trusted_ca.py --github-env
      # main must contain the required test suite before this workflow lands.
      # Record the resolved SHA; dispatch accepts a SHA to reproduce a run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: kkdao/kiss-bdk
          ref: ${{ inputs.bdk_ref || 'main' }}
          path: coordinator
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libv4l-dev libclang-dev clang libssl-dev ca-certificates
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: coordinator -> target
      - name: Send, spend, and recover Silent Payment change
        run: bash signer/sim/run_sp_interop.sh coordinator
