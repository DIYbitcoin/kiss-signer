name: Bug report
description: Something the device or the simulator does wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If the bug could put funds at risk, stop here and read
        [SECURITY.md](https://github.com/diybitcoin/kiss-signer/blob/main/SECURITY.md).
        Report that privately instead.

  - type: input
    id: version
    attributes:
      label: Firmware version
      description: Settings shows it, or give the tag you built.
      placeholder: v0.1.0-beta11
    validations:
      required: true

  - type: dropdown
    id: board
    attributes:
      label: Board
      options:
        - Guition JC4880P443C (4.3in)
        - Waveshare ESP32-P4-WIFI6-Touch-LCD-3.5 (3.5in)
        - Guition JC1060P470C (7in)
        - Something else (say which under "What happened")
    validations:
      required: true

  - type: dropdown
    id: case-label
    attributes:
      label: Does the label on the back of the case say V2?
      description: Guition sells two different screens under the same board name, and only the label tells them apart.
      options:
        - "No"
        - "Yes"
        - There is no label
    validations:
      required: true

  - type: dropdown
    id: camera
    attributes:
      label: Is the camera turned to face out the back, away from you?
      description: The Guition boards ship with it facing you; QR scanning needs it facing out.
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. From the home screen, ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A photo of the screen, serial output, or the PSBT that triggered it. Never attach a seed or a real signing key.
    validations:
      required: false
