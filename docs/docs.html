  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KISS Signer Docs</title>
    <!-- /docs is the name people type. The guide has always been guide.html
         and every shared link and anchor points there, so this forwards

         the storage topic. -->

    <script>location.replace("guide.html" + location.hash);</script>
  </head>

  </body>
</html>
