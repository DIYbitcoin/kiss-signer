dependencies:
  idf:
    version: ">=6.0"
  espressif/esp_lcd_st7701: "^2.0.0"
  espressif/esp_lcd_touch_gt911: "^1.1.0"
  espressif/esp_video: "^2"
  # Vendored override: registry 2.3.0 + the OV02C10 driver from Guition's board demo
  # (reviewed; Espressif-authored, Apache-2.0). The registry component lacks OV02C10,
  # which is the sensor actually shipped on the JC4880P443C camera ribbon.
  espressif/esp_cam_sensor:
    version: "*"
    override_path: "../components/esp_cam_sensor"
  # LVGL is a direct dependency, pinned. It used to arrive through esp_lvgl_port,
  # which nothing called; dropping that took LVGL out of the graph with it, and
  # every CONFIG_LV_* line out of sdkconfig. sim/lv_conf.h and
  # .github/actions/fetch-lvgl both follow the version this lock records.
  lvgl/lvgl: "==9.5.0"
  # Transitive components of esp_video, pinned to the versions the published
  # hashes were built with. A manifest change makes the solver re-solve the
  # whole graph and it floats these to newer patches on its own; a bump is a
  # change of its own, made on purpose, not a side effect of editing this file.
  espressif/usb: "==1.4.1"
  espressif/usb_host_uvc: "==2.5.1"
  espressif/esp_sccb_intf: "==0.0.8"
